ction{break-inside:avoid}header{padding:20px}}</style><header><div class="eyebrow">OFFLINE UX KIT · LOCAL EVIDENCE</div><h1>体验，从过程看见。</h1><p>离线体验报告 / Offline experience report</p></header><main><nav><button id="json">导出 JSON</button><button id="md">Markdown 摘要</button><button id="print">打印 / PDF</button></nav><p id="status" role="status"></p><label>版本 / 批次 / 模式 <select id="cohort"></select></label><div id="view"></div><footer>长时间停留与重复点击是疑似信号，不是体验差的结论。未采集原始输入。报告仍包含行为数据，请仅分享给授权人员。<br>Active time uses a 20s default idle cutoff. Closed-browser gaps are excluded.</footer></main><script type="application/json" id="report-data">[{"meta":{"schemaVersion":1,"kitVersion":"main","appId":"sample","participantId":"synthetic-example","sessionId":"sample-1","buildId":"demo","batchId":"synthetic","variant":"offline-scripted","startedAt":"2026-09-10T00:00:00Z","endedAt":"2026-09-10T00:01:00Z","storageMode":"memory"},"events":[{"eventId":"sample-0","seq":1,"timestamp":"2026-09-10T00:00:00Z","elapsedMs":0,"sincePreviousMs":2000,"name":"run_start","stepId":"","taskId":"sample-form","taskRunId":"task-1","data":{}},{"eventId":"sample-1","seq":2,"timestamp":"2026-09-10T00:00:00Z","elapsedMs":2000,"sincePreviousMs":2000,"name":"task_start","stepId":"","taskId":"sample-form","taskRunId":"task-1","data":{}},{"eventId":"sample-2","seq":3,"timestamp":"2026-09-10T00:00:00Z","elapsedMs":4000,"sincePreviousMs":2000,"name":"step_enter","stepId":"preferences","taskId":"sample-form","taskRunId":"task-1","data":{}},{"eventId":"sample-3","seq":4,"timestamp":"2026-09-10T00:00:00Z","elapsedMs":6000,"sincePreviousMs":2000,"name":"choice","stepId":"preferences","taskId":"sample-form","taskRunId":"task-1","data":{"optionId":"a","changed":false}},{"eventId":"sample-4","seq":5,"timestamp":"2026-09-10T00:00:00Z","elapsedMs":8000,"sincePreviousMs":2000,"name":"time_slice","stepId":"preferences","taskId":"sample-form","taskRunId":"task-1","data":{"activeMs":8000,"visibleMs":8000,"hiddenMs":0}},{"eventId":"sample-5","seq":6,"timestamp":"2026-09-10T00:00:00Z","elapsedMs":10000,"sincePreviousMs":2000,"name":"back","stepId":"preferences","taskId":"sample-form","taskRunId":"task-1","data":{}},{"eventId":"sample-6","seq":7,"timestamp":"2026-09-10T00:00:00Z","elapsedMs":12000,"sincePreviousMs":2000,"name":"choice","stepId":"preferences","taskId":"sample-form","taskRunId":"task-1","data":{"optionId":"b","previousOptionId":"a","changed":true}},{"eventId":"sample-7","seq":8,"timestamp":"2026-09-10T00:00:00Z","elapsedMs":14000,"sincePreviousMs":2000,"name":"feedback","stepId":"preferences","taskId":"sample-form","taskRunId":"task-1","data":{"category":"unclear"}},{"eventId":"sample-8","seq":9,"timestamp":"2026-09-10T00:00:00Z","elapsedMs":16000,"sincePreviousMs":2000,"name":"step_enter","stepId":"review","taskId":"sample-form","taskRunId":"task-1","data":{}},{"eventId":"sample-9","seq":10,"timestamp":"2026-09-10T00:00:00Z","elapsedMs":18000,"sincePreviousMs":2000,"name":"time_slice","stepId":"review","taskId":"sample-form","taskRunId":"task-1","data":{"activeMs":8000,"visibleMs":8000,"hiddenMs":0}},{"eventId":"sample-10","seq":11,"timestamp":"2026-09-10T00:00:00Z","elapsedMs":20000,"sincePreviousMs":2000,"name":"task_end","stepId":"review","taskId":"sample-form","taskRunId":"task-1","data":{"status":"completed"}},{"eventId":"sample-11","seq":12,"timestamp":"2026-09-10T00:00:00Z","elapsedMs":22000,"sincePreviousMs":2000,"name":"run_end","stepId":"","taskId":"sample-form","taskRunId":"task-1","data":{}}]}]</script><script>const validate=function validate(run) {
    const allowed=new Set(['optionId','previousOptionId','changed','length','durationMs','status','code','category','reason','requestId','x','y','rating','activeMs','visibleMs','hiddenMs','count','inputMode']);

  };const summarize=function summarize(run) {

  };const parseImport=function parseImport(text,filename){

  };const mergeRuns=function mergeRuns(existing,incoming){

  };(function reportApp(){

    let current=[], summaries=[];
    function table(parent,heads,rows){const wrap=make('div',undefined,'scroll'),t=make('table'),h=make('tr');heads.forEach(x=>h.append(make('th',x)));t.append(h);rows.forEach(row=>{const tr=make('tr');row.forEach(x=>tr.append(make('td',x)));t.append(tr);});wrap.append(t);parent.append(wrap);}

      const dwell=section('02 · 步骤活跃时间 / Step active time');const steps=Object.create(null);summaries.forEach(s=>Object.entries(s.steps).forEach(([k,v])=>{(steps[k] ||= []).push(v);}));
      bars(dwell,Object.entries(steps).map(([k,v])=>[k,median(v)/1000]));dwell.append(make('p','柱形：到访会话的中位活跃秒数；空白步骤表示未进入任务。'));

        Object.entries(issues).forEach(([k,v],i)=>{const c=document.createElementNS(ns,'circle');for(const [a,b]of Object.entries({cx:60,cy:60,r:43,fill:'none',stroke:colors[i%colors.length],'stroke-width':18,'stroke-dasharray':(v/total*270.18)+' '+270.18,'stroke-dashoffset':-offset,transform:'rotate(-90 60 60)'}))c.setAttribute(a,b);offset+=v/total*270.18;svg.append(c);});wrap.append(svg);issueSection.append(wrap);table(wrap,['类别','次数'],Object.entries(issues));

      const sessions=section('会话证据 / Session evidence');
      current.forEach((r,i)=>{const detail=make('details'),summary=make('summary',r.meta.participantId+' · '+r.meta.sessionId+' · '+(r.meta.endedAt?'已结束':'未结束'));detail.append(summary);const path=make('div',undefined,'path');summaries[i].path.forEach(x=>path.append(make('span',x,'chip')));detail.append(path);table(detail,['#','秒','任务','步骤','事件','元数据'],r.events.map(e=>[e.seq,(e.elapsedMs/1000).toFixed(2),e.taskId,e.stepId,e.name,JSON.stringify(e.data)]));sessions.append(detail);});
