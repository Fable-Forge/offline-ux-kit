  const reportCSS='*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#1e3430;font:15px/1.6 system-ui,sans-serif}header{background:#123d35;color:white;padding:48px max(24px,calc((100vw - 1120px)/2))}h1{font-size:36px;margin:10px 0}.eyebrow{letter-spacing:3px;font-size:11px;color:#a7ce9e}main{max-width:1168px;margin:auto;padding:30px 24px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}button,.button,select{font:inherit;border:1px solid #bccbc5;background:white;border-radius:8px;padding:9px 14px;color:inherit;cursor:pointer}input[type=file]{display:block;max-width:220px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:22px 0}.card,section{background:white;border:1px solid #dbe3de;border-radius:14px;padding:20px}.card strong{display:block;font-size:28px}.card span{font-size:12px;color:#536e65}section{margin:18px 0}h2{font-size:19px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;border-bottom:1px solid #e3e9e4;padding:10px;overflow-wrap:anywhere}.scroll{overflow:auto;max-height:480px}.bar{display:grid;grid-template-columns:minmax(110px,1fr) 3fr 70px;gap:12px;align-items:center;margin:12px 0}.track{height:14px;background:#edf1ee;border-radius:8px;overflow:hidden}.fill{height:100%;background:#3c846b}.path{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#e7eee6;padding:5px 10px;border-radius:6px}footer{font-size:12px;color:#536e65;margin:32px 0}.issue{display:flex;gap:28px;align-items:center;flex-wrap:wrap}svg{max-width:200px}summary{cursor:pointer}#status{color:#8c4516} @media print{nav,select{display:none}.scroll{max-height:none}section{break-inside:avoid}header{padding:20px}}';

      [['会话 Sessions',current.length],['活跃 Active',Math.round(sum('activeMs')/1000)+'s'],['完成任务',sum('completed')],['改选',sum('changes')],['反馈',sum('feedback')],['疑似信号',sum('signals')]].forEach(([label,n])=>{const c=make('div',undefined,'card');c.append(make('strong',n),make('span',label));cards.append(c);});$('view').append(cards);
      const funnel=section('01 · 有序流程 / Ordered funnel');
      const stages=['run_start','task_start','step_enter','task_end'];
      table(funnel,['阶段','到达会话数','会话占比'],stages.map((name,i)=>{const n=current.filter(r=>{let index=-1;return stages.slice(0,i+1).every(stage=>{index=r.events.findIndex((e,j)=>j>index&&e.name===stage&&(stage!=='task_end'||e.data.status==='completed'));return index>=0;});}).length;return [name,n,current.length===1?(n?'已到达':'未到达'):(100*n/current.length).toFixed(1)+'%'];}));
      const dwell=section('02 · 步骤活跃时间 / Step active time');const steps=Object.create(null);summaries.forEach(s=>Object.entries(s.steps).forEach(([k,v])=>{(steps[k] ||= []).push(v);}));
      bars(dwell,Object.entries(steps).map(([k,v])=>[k,median(v)/1000]));dwell.append(make('p','柱形：到访会话的中位活跃秒数；空白步骤表示未进入任务。'));
      const issues=Object.create(null);summaries.forEach(s=>Object.entries(s.issues).forEach(([k,v])=>issues[k]=(issues[k]||0)+v));
      const issueSection=section('03 · 反馈与疑似信号 / Feedback & signals');
      if(Object.keys(issues).length){
        const wrap=make('div',undefined,'issue'),ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 120 120');svg.setAttribute('role','img');svg.setAttribute('aria-label','Issue distribution');let offset=0,total=Object.values(issues).reduce((a,b)=>a+b,0);const colors=['#28785f','#bc8a35','#708ad0','#be7560','#98b758'];
        Object.entries(issues).forEach(([k,v],i)=>{const c=document.createElementNS(ns,'circle');for(const [a,b]of Object.entries({cx:60,cy:60,r:43,fill:'none',stroke:colors[i%colors.length],'stroke-width':18,'stroke-dasharray':(v/total*270.18)+' '+270.18,'stroke-dashoffset':-offset,transform:'rotate(-90 60 60)'}))c.setAttribute(a,b);offset+=v/total*270.18;svg.append(c);});wrap.append(svg);issueSection.append(wrap);table(wrap,['类别','次数'],Object.entries(issues));
      }else issueSection.append(make('p','本批次没有记录反馈或疑似信号。'));
      const ai=summaries.some(s=>s.aiSuccess+s.aiError+s.aiFallback);
      if(ai){const s=section('04 · AI 请求 / AI requests');table(s,['成功','失败','Fallback','延迟中位 ms'],[[sum('aiSuccess'),sum('aiError'),sum('aiFallback'),Math.round(median(summaries.flatMap(s=>s.aiDurations)))]]);}
      const choices=section('选择分布 / Choice distribution'),counts=Object.create(null);current.forEach(r=>r.events.filter(e=>e.name==='choice').forEach(e=>{const k=[e.taskId,e.stepId,e.data.optionId].join(' / ');counts[k]=(counts[k]||0)+1;}));table(choices,['任务 / 步骤 / 选项','选择次数（含重复）'],Object.entries(counts));
      const sessions=section('会话证据 / Session evidence');
      current.forEach((r,i)=>{const detail=make('details'),summary=make('summary',r.meta.participantId+' · '+r.meta.sessionId+' · '+(r.meta.endedAt?'已结束':'未结束'));detail.append(summary);const path=make('div',undefined,'path');summaries[i].path.forEach(x=>path.append(make('span',x,'chip')));detail.append(path);table(detail,['#','秒','任务','步骤','事件','元数据'],r.events.map(e=>[e.seq,(e.elapsedMs/1000).toFixed(2),e.taskId,e.stepId,e.name,JSON.stringify(e.data)]));sessions.append(detail);});
    }
    function refresh(){const selected=$('cohort').value;$('cohort').replaceChildren();[...new Set(all.map(key))].forEach(k=>{const o=make('option',JSON.parse(k).join(' / '));o.value=k;$('cohort').append(o);});if([...$('cohort').options].some(o=>o.value===selected))$('cohort').value=selected;render();}
    $('cohort').onchange=render;$('print').onclick=()=>window.print();
    $('json').onclick=()=>download('offline-ux-runs.json',JSON.stringify(current,null,2),'application/json');
    $('md').onclick=()=>{const lines=['# Offline UX summary','','疑似信号需要结合任务内容和主动反馈解释。',''];current.forEach((r,i)=>{const s=summaries[i];lines.push('## '+r.meta.participantId,'','- Session: '+r.meta.sessionId,'- Active seconds: '+(s.activeMs/1000).toFixed(1),'- Completed tasks: '+s.completed,'- Changed choices: '+s.changes,'- Feedback: '+s.feedback,'- Signals: '+s.signals,'');});download('offline-ux-summary.md',lines.join('\n'),'text/markdown');};
    if($('files')) $('files').onchange=async event=>{
      const errors=[];let added=0,duplicates=0;
      for(const f of event.target.files){try{if(f.size>10*1024*1024)throw Error('File exceeds 10 MiB');
        const result=mergeRuns(all,parseImport(await f.text(),f.name));all=result.runs;added+=result.added;duplicates+=result.duplicates;
      }catch(e){errors.push(f.name+': '+e.message);}}
      $('status').textContent=added+' imported, '+duplicates+' duplicates. '+errors.join(' | ');refresh();
    };
    refresh();
  }
  return {VERSION,create,validate,summarize,sanitize,report,reviewer,parseImport,mergeRuns,download,escape};
});
</script>
<script>
(async()=>{
const mode='form',$=id=>document.getElementById(id);let ux=null,at=0,result=null;
const warningTimer=setInterval(()=>{if(ux)$('storageWarning').textContent=ux.warning;},2000);
const form=[['你希望参加哪类工作坊？',['design','engineering','research']],['希望采用哪种形式？',['onsite','remote']],['补充说明',[]],['确认并完成',[]]];
const dialogue=[['客户：你们的方案为什么比别人贵？',['explain-value','offer-discount']],['客户：我担心团队学不会。',['show-training','avoid-question']],['你准备如何回应？',[]],['演练总结',[]]];
let steps=mode==='form'?form:dialogue;const picked={};
$('title').textContent=mode==='form'?'工作坊报名 · 离线表单':'客户沟通 · 分支演练';
function status(s){$('status').textContent=s+(ux?.warning?' '+ux.warning:'');}
function show(){ux.step('step-'+at);$('progress').textContent=(at+1)+' / '+steps.length;$('question').textContent=steps[at][0];$('options').replaceChildren();steps[at][1].forEach(v=>{const b=document.createElement('button');b.textContent=(picked[at]===v?'✓ ':'')+v;b.dataset.uxId=v;b.onclick=()=>{picked[at]=v;ux.choice(v);if(mode==='dialogue'&&at===0)steps[1][0]=v==='offer-discount'?'客户：折扣结束后会涨价吗？':'客户：你能演示具体价值吗？';for(const x of $('options').children)x.textContent=(picked[at]===x.dataset.uxId?'✓ ':'')+x.dataset.uxId;};$('options').append(b);});$('back').disabled=at===0;$('textLabel').hidden=at!==2;$('next').textContent=at===3?'确认完成':'下一步';}
$('start').onclick=async()=>{if(!$('agree').checked)return status('请先确认采集说明。');if(!/^[A-Za-z0-9_.:-]{1,60}$/.test($('participant').value))return status('请使用字母、数字、短横线组成的匿名代号。');$('start').disabled=true;
try{let sid;try{sid=localStorage.getItem('oux-demo-'+mode);}catch(_){}sid=sid||crypto.randomUUID();ux=await OfflineUX.create({appId:'demo-'+mode,participantId:$('participant').value,sessionId:sid,buildId:'demo'});if(ux.ended){ux.dispose();sid=crypto.randomUUID();ux=await OfflineUX.create({appId:'demo-'+mode,participantId:$('participant').value,sessionId:sid,buildId:'demo'});}try{localStorage.setItem('oux-demo-'+mode,sid);}catch(_){}$('consent').hidden=true;$('app').hidden=false;ux.task(mode);show();status('本地记录已开启。');}catch(e){status(e.message);$('start').disabled=false;}};
$('next').onclick=()=>{if(at<2&&!picked[at]){ux.track('signal',{category:'missing_choice'});return status('请先选择一个选项。');}if(at===2)ux.reply($('reply').value);if(at===3){ux.endTask('completed');$('next').disabled=true;$('back').disabled=true;status('任务已完成，可以结束并导出报告。');return;}at++;show();};
$('back').onclick=()=>{ux.back();at=Math.max(0,at-1);show();};
$('sendFeedback').onclick=()=>{ux.feedback($('feedback').value);status('反馈已记录。');};
$('finish').onclick=async()=>{result=await ux.finish(Number($('rating').value));clearInterval(warningTimer);$('storageWarning').textContent=ux.warning;OfflineUX.download(mode+'-report.html',OfflineUX.report(result));$('next').disabled=true;$('back').disabled=true;$('sendFeedback').disabled=true;status('报告已生成；也可以导出原始 JSON。');};
$('raw').onclick=async()=>OfflineUX.download(mode+'-run.json',JSON.stringify(result||await ux.snapshot(),null,2),'application/json');
})();
</script></html>
