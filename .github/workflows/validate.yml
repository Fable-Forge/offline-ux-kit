name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository contract
        run: python scripts/validate_repository.py
      - name: Build and test toolkit
        run: npm test
      - name: Compile bundled Python scripts
        run: python -m compileall -q scripts tests
